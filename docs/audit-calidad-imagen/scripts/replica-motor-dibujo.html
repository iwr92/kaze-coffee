<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; background: #f7f5f0; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
<canvas id="c"></canvas>
<script>
// Réplica fiel de la ruta de dibujo de CinematicMediaController + framing.ts (progreso 0).
const params = new URLSearchParams(location.search);
const src = params.get("src");
const smoothing = params.get("q") ?? "high";
const dprCap = Number(params.get("cap") ?? 2);

function computeFraming(viewW, viewH, imageAspect, focal) {
  const aspect = viewW / viewH;
  let width, height, centerY;
  if (aspect >= 1.15) {
    width = Math.max(viewW, viewH * imageAspect);
    height = width / imageAspect;
    centerY = viewH / 2;
  } else {
    const t = Math.min(1, Math.max(0, (aspect - 0.45) / (1.15 - 0.45)));
    height = viewH * (0.5 + t * 0.4);
    width = height * imageAspect;
    if (width < viewW * 1.25) { width = viewW * 1.25; height = width / imageAspect; }
    centerY = viewH * (0.66 - t * 0.12);
  }
  let x = viewW / 2 - focal * width;
  x = Math.min(0, Math.max(viewW - width, x));
  const lowY = Math.min(0, viewH - height), highY = Math.max(0, viewH - height);
  const y = Math.min(highY, Math.max(lowY, centerY - height / 2));
  return { x, y, width, height };
}

(async () => {
  const blob = await (await fetch(src)).blob();
  const bmp = await createImageBitmap(blob);
  const c = document.getElementById("c");
  const dpr = Math.min(devicePixelRatio || 1, dprCap);
  const cssW = c.clientWidth, cssH = c.clientHeight;
  c.width = Math.round(cssW * dpr);
  c.height = Math.round(cssH * dpr);
  const ctx = c.getContext("2d", { alpha: false });
  const r = computeFraming(cssW, cssH, bmp.width / bmp.height, 0.6);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#f7f5f0";
  ctx.fillRect(0, 0, cssW, cssH);
  ctx.imageSmoothingEnabled = smoothing !== "off";
  if (smoothing !== "off") ctx.imageSmoothingQuality = smoothing;
  ctx.drawImage(bmp, r.x, r.y, r.width, r.height);
  window.__info = { rect: r, dpr, devicePixelRatio, backing: [c.width, c.height], css: [cssW, cssH], src: [bmp.width, bmp.height] };
  document.title = "ready";
})();
</script>
