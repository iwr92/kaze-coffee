<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kaze</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Shippori+Mincho+B1:wght@600&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface, #f3ecdf); color:var(--ink, #151311); font-family:var(--font-sans, "Instrument Sans", system-ui, sans-serif); overflow:hidden; }
  .cover { position:relative; height:288px; width:960px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--ink, #151311); }
  .tint { fill:var(--line, #d6c8ae); }
  .warm { fill:var(--accent, #84532e); }
  .blk { rx:var(--radius-0, 0px); }
  .gust { rx:var(--space-1, 4px); }
  .gust.in { fill:var(--surface, #f3ecdf); }
  .gust.out { fill:var(--ink, #151311); }
  .words { position:absolute; left:var(--space-12, 48px); bottom:var(--space-12, 48px); max-width:440px; }
  .name { margin:0; font-family:var(--font-display, "Shippori Mincho B1", serif); font-size:120px; line-height:.92; font-weight:600; letter-spacing:-.01em; color:var(--ink, #151311); }
  .tag { margin:var(--space-3, 12px) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted, #5f564c); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      ink 256×256 slab bled off the top (the brand's black, inverts to crema in the Negro theme) · line 80×160 tint for relief · accent 64×64 once (tostado is a sparing accent) — ≈30% of 960×288
        arrangement one tall slab with two satellites, bottoms on one line space-8 above the edge, gutters space-4
        pattern     literal motif from the name (風, wind): gusts as space-2-tall pills at a space-6 pitch, cut into the slab in surface and trailing out past its right edge in ink
        scales      sides in space-4 multiples; gutters space-4; pitch space-6; blocks radius-0; gust rx space-1 (half of space-2)
      -->
      <rect class="tint blk" x="16" y="96" width="80" height="160"/>
      <rect class="deep blk" x="112" y="0" width="256" height="256"/>
      <rect class="warm blk" x="384" y="192" width="64" height="64"/>
      <rect class="gust in" x="208" y="48" width="160" height="8"/>
      <rect class="gust out" x="376" y="48" width="104" height="8"/>
      <rect class="gust in" x="160" y="72" width="208" height="8"/>
      <rect class="gust out" x="376" y="72" width="56" height="8"/>
      <rect class="gust in" x="256" y="96" width="112" height="8"/>
      <rect class="gust out" x="376" y="96" width="104" height="8"/>
      <rect class="gust in" x="184" y="120" width="184" height="8"/>
      <rect class="gust out" x="376" y="120" width="80" height="8"/>
      <rect class="gust in" x="232" y="144" width="136" height="8"/>
      <rect class="gust out" x="376" y="144" width="32" height="8"/>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Kaze</h1>
    <p class="tag">Café de especialidad, a tu ritmo.</p>
  </div>
</div>
</body>
</html>
